name: el_patol
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_staggered_animations: ^1.1.0

  google_fonts: ^4.0.4
  fl_chart: ^0.55.2
  crop_your_image: ^0.7.4
  flutter_cache_manager: ^3.3.1
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  provider: ^6.1.2
  custom_pop_up_menu_fork: ^2.0.0
  firebase_auth: ^4.16.0
  slide_to_act: ^2.0.2
  image_picker: ^1.0.8
  http: ^1.1.0
  shared_preferences: ^2.2.3
  flash: ^3.0.5+2
  easy_stepper: ^0.8.3
  shimmer: ^3.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.2.4
  model_viewer_plus: ^1.7.2
  lottie: ^2.6.0
  video_player: ^2.8.1
  rxdart: ^0.27.7
  circular_menu: ^2.0.1
  geolocator: ^11.0.0
  location: ^5.0.3
  permission_handler: ^11.0.1
  confetti: ^0.8.0
  animate_do: ^4.2.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_masonry_view: ^0.0.2
  date_format: ^2.0.7
  carousel_slider: ^5.1.1
  d_chart: ^2.6.9
  status_alert: ^1.0.1
  random_string: ^2.3.1
  vibration: ^3.1.3
  sensors_plus: ^4.0.0
  audioplayers: ^5.2.1
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/characters/
    - assets/
    - assets/introvideo.mp4
    - assets/newIcon/
    - assets/icons/
    - assets/newPhoto/mainPhoto.png
    - assets/newPhoto/logoPatol.png
    - assets/newPhoto/smallAlbert.png
    - assets/newPhoto/docCrazy.png
    - assets/newPhoto/doc.png
    - assets/newPhoto/crazy.png
    - assets/newPhoto/boy.png
    - assets/newPhoto/albert.png
    - assets/models/loder.glb
    - assets/lottie/background.json
    - assets/lottie/a.json
    - assets/lottie/b.json
    - assets/lottie/c.json
    - assets/lottie/d.json
    - assets/lottie/e.json
    - assets/lottie/f.json
    - assets/lottie/g.json
    - assets/lottie/h.json
    - assets/lottie/i.json
    - assets/lottie/j.json
    - assets/lottie/k.json
    - assets/lottie/l.json
    - assets/lottie/l.json
    - assets/lottie/HandLoding.json
    - assets/lottie/Lab_download.json
    - assets/lottie/fire.json



flutter_icons:
  android: true
  ios: true
  image_path: "assets/iconLogo.png"
  adaptive_icon_background: "#161D3F"
  adaptive_icon_foreground: "assets/iconLogo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/iconLogo.png
  android: true
  ios: true

  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#161D3F"
    theme_color: "#161D3F"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
