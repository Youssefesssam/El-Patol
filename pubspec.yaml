name: el_patol
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_staggered_animations: ^1.1.0
  crop_your_image: ^0.7.4
  firebase_core: ^3.10.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.3

  google_fonts: ^6.2.1
  fl_chart: ^0.69.0        # ✅ تحديث لإصلاح MediaQuery.boldTextOverride
  flutter_cache_manager: ^3.4.1
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  custom_pop_up_menu_fork: ^2.0.0

  slide_to_act: ^2.0.2
  image_picker: ^1.1.2     # ✅ تحديث لإصلاح UnmodifiableUint8ListView
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flash: ^3.1.0
  easy_stepper: ^0.8.3
  shimmer: ^3.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  model_viewer_plus: ^1.9.0
  lottie: ^3.1.2
  video_player: ^2.9.2
  rxdart: ^0.28.0
  circular_menu: ^2.0.1
  geolocator: ^13.0.1
  location: ^7.0.0
  permission_handler: ^11.3.1
  confetti: ^0.8.0
  animate_do: ^4.2.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_masonry_view: ^0.0.2
  date_format: ^2.0.7
  carousel_slider: ^5.0.0
  d_chart: ^2.7.7
  status_alert: ^1.0.1
  random_string: ^2.3.1
  vibration: ^3.1.3
  sensors_plus: ^6.0.1
  audioplayers: ^6.1.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/characters/
    - assets/
    - assets/introvideo.mp4
    - assets/newIcon/
    - assets/icons/
    - assets/newPhoto/mainPhoto.png
    - assets/newPhoto/logoPatol.png
    - assets/newPhoto/smallAlbert.png
    - assets/newPhoto/docCrazy.png
    - assets/newPhoto/doc.png
    - assets/newPhoto/crazy.png
    - assets/newPhoto/boy.png
    - assets/newPhoto/albert.png
    - assets/models/loder.glb
    - assets/lottie/background.json
    - assets/lottie/a.json
    - assets/lottie/b.json
    - assets/lottie/c.json
    - assets/lottie/d.json
    - assets/lottie/e.json
    - assets/lottie/f.json
    - assets/lottie/g.json
    - assets/lottie/h.json
    - assets/lottie/i.json
    - assets/lottie/j.json
    - assets/lottie/k.json
    - assets/lottie/l.json
    - assets/lottie/HandLoding.json
    - assets/lottie/Lab_download.json
    - assets/lottie/fire.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/iconLogo.png"
  adaptive_icon_background: "#161D3F"
  adaptive_icon_foreground: "assets/iconLogo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/iconLogo.png
  android: true
  ios: true

  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#161D3F"
    theme_color: "#161D3F"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
